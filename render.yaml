# Render Blueprint: Infrastructure as Code
# Deploys Web Service + Managed PostgreSQL Database on Render
services:
  - type: web
    name: llm-gateway
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: llm-gateway-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: llm-gateway-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: llm-gateway-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: llm-gateway-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: llm-gateway-db
          property: password
      - key: ADMIN_API_KEY
        generateValue: true
      - key: PRIMARY_PROVIDER_API_KEY
        sync: false
      - key: PRIMARY_PROVIDER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PRIMARY_MODEL
        value: openai/gpt-oss-20b
      - key: FALLBACK_PROVIDER_API_KEY
        sync: false
      - key: FALLBACK_PROVIDER_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: FALLBACK_MODEL
        value: gemini-1.5-flash
      - key: USD_INR
        value: "84.00"

databases:
  - name: llm-gateway-db
    databaseName: llm_gateway
    user: gateway_user
    plan: free
    region: oregon

