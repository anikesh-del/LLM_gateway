services:
  postgres:
    image: postgres:16-alpine
    container_name: llm_gateway_postgres
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d llm_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

